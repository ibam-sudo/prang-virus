<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚠️ VIRUS DETECTED</title>

<style>
body{
    margin:0;
    background:#050505;
    color:#ff3030;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box{
    width:850px;
    max-width:90%;
    background:#090909;
    border:2px solid red;
    box-shadow:0 0 30px red;
    padding:30px;
    text-align:center;
}
.warning{
    font-size:70px;
}
h1{
    font-size:40px;
}
.terminal{
    text-align:left;
    background:#000;
    padding:20px;
    height:180px;
    overflow:hidden;
}
.progress{
    height:25px;
    border:1px solid red;
    margin-top:20px;
}
.bar{
    width:0%;
    height:100%;
    background:red;
}
button{
    margin-top:20px;
    padding:14px 25px;
    background:red;
    color:white;
    border:0;
    font-size:18px;
    cursor:pointer;
}
#prank{
    display:none;
    color:#00ff66;
    font-size:28px;
}
</style>
</head>

<body>

<div class="box">

<div class="warning">⚠️</div>

<h1 id="title">VIRUS DETECTED!</h1>

<p>CRITICAL SYSTEM WARNING</p>

<div class="terminal" id="terminal">
> Starting security scanner...<br>
> Scanning system...<br>
> Searching suspicious files...
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="percent">0%</p>

<button onclick="prank()">STOP SCAN</button>

<div id="prank">
😂 KENA PRANK! 😂<br>
<small>Tenang, ini cuma website palsu 😎</small>
</div>

</div>

<script>

let progress = 0;

let scan = setInterval(function(){

    progress += 2;

    document.getElementById("bar").style.width =
        progress + "%";

    document.getElementById("percent").innerText =
        progress + "%";

    if(progress >= 100){
        clearInterval(scan);
        document.getElementById("terminal").innerHTML +=
        "<br><b>> !!! CRITICAL THREAT DETECTED !!!</b>";
    }

},200);


function prank(){

    clearInterval(scan);

    document.getElementById("title").innerText =
        "HAHA KENA PRANK! 😂";

    document.getElementById("terminal").innerHTML =
        "> Tidak ada virus.<br>" +
        "> Tidak ada file yang dihapus.<br>" +
        "> Ini cuma website prank.";

    document.getElementById("prank").style.display =
        "block";

    document.querySelector("button").style.display =
        "none";
}

</script>

</body>
</html>
